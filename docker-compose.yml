# =============================================================================
# Docker Compose - Password Manager (Development)
# =============================================================================
# IMPORTANT: For development, ensure DEBUG=True in environment variables
# This enables:
#   - Lenient rate limiting (30/min vs 3/min for auth)
#   - Disabled HTTPS redirect (prevents SSL errors)
#   - Detailed error messages
# =============================================================================

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: password_manager_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-password_manager}
      POSTGRES_USER: ${DB_USER:-pm_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pm_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - password_manager_network
    restart: unless-stopped

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: password_manager_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD:-redis123}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - password_manager_network
    restart: unless-stopped

  # One-time init: run migrations and collectstatic before backend starts
  backend-init:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: password_manager_backend_init
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput"
    volumes:
      - ./password_manager:/app
      - static_volume:/app/staticfiles
    environment:
      - DEBUG=${DEBUG:-True}
      - "SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}"
      - DATABASE_URL=postgresql://${DB_USER:-pm_user}:${DB_PASSWORD:-password123}@postgres:5432/${DB_NAME:-password_manager}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - password_manager_network
    restart: "no"

  # Django Backend (HTTP Server)
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: password_manager_backend
    command: daphne -b 0.0.0.0 -p 8000 password_manager.asgi:application
    volumes:
      - ./password_manager:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      # Read-only: lets the clearnet backend report the .onion address so a
      # user browsing over clearnet can see where anonymous access lives.
      # Empty until the tor profile has run, in which case the capability
      # correctly reports that no onion address is available.
      - tor_shared:/var/lib/tor-shared:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DEBUG=${DEBUG:-True}
      - "SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}"
      - DATABASE_URL=postgresql://${DB_USER:-pm_user}:${DB_PASSWORD:-password123}@postgres:5432/${DB_NAME:-password_manager}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      # Dev-prod parity: set these to 'true' to test Redis-backed channels
      # and caching locally (matches production behaviour). When unset,
      # Django falls back to InMemoryChannelLayer and locmem cache.
      - USE_REDIS_CHANNELS=${USE_REDIS_CHANNELS:-false}
      - USE_REDIS_CACHE=${USE_REDIS_CACHE:-false}
      # OpenID Connect (OIDC) Configuration
      - OIDC_RP_CLIENT_ID=${OIDC_RP_CLIENT_ID:-}
      - OIDC_RP_CLIENT_SECRET=${OIDC_RP_CLIENT_SECRET:-}
      - OIDC_OP_BASE_URL=${OIDC_OP_BASE_URL:-https://accounts.google.com}
      - OIDC_VERIFY_SSL=${OIDC_VERIFY_SSL:-True}
      - OIDC_USE_NONCE=${OIDC_USE_NONCE:-True}
      # Tor: off by default. Set TOR_ENABLED=true in .env alongside
      # `--profile tor` so this clearnet listener can read live Tor state and
      # show users the .onion address. It can never report ITS OWN requests as
      # anonymous: they arrive on port 8000, not the onion ingress port.
      - TOR_ENABLED=${TOR_ENABLED:-false}
      - TOR_CONTROL_HOST=tor
      - TOR_CONTROL_PORT=9051
      - TOR_CONTROL_PASSWORD=${TOR_CONTROL_PASSWORD:-}
      - TOR_SOCKS_HOST=tor
      - TOR_SOCKS_PORT=9050
      - TOR_ONION_HOSTNAME_FILE=/var/lib/tor-shared/hostname
      - TOR_ONION_INGRESS_PORT=8443
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-init:
        condition: service_completed_successfully
    networks:
      - password_manager_network
    restart: unless-stopped

  # ===========================================================================
  # 🧅 Tor — real anonymity transport for Dark Protocol (opt-in)
  # ===========================================================================
  # Start with:  docker compose --profile tor up
  #
  # Publishes the backend as a Tor v3 onion service, so a client reaching the
  # .onion address gets a circuit that terminates inside Tor: no exit node, and
  # the backend never sees the client IP. Without this profile the Dark
  # Protocol feature reports Unavailable rather than claiming anonymity it
  # cannot provide.
  #
  # Two services come up together: `tor` (the daemon) and `backend-onion` (a
  # dedicated ingress listener the onion service forwards to). They are
  # separate so the backend can tell an onion request from a clearnet one by
  # the port it arrived on — see TOR['ONION_INGRESS_PORT'].
  tor:
    build:
      context: .
      dockerfile: docker/tor/Dockerfile
    container_name: password_manager_tor
    profiles: ["tor"]
    environment:
      # No default: an unauthenticated control port would let anything on this
      # network reconfigure Tor, so the container refuses to start without it.
      - "TOR_CONTROL_PASSWORD=${TOR_CONTROL_PASSWORD:?Set TOR_CONTROL_PASSWORD in .env to use the tor profile}"
      - TOR_ONION_TARGET=backend-onion:8443
    volumes:
      # Private to this container: holds the hidden-service private key.
      - tor_data:/var/lib/tor
      # Shared, public: only the .onion hostname is copied here for the backend.
      - tor_shared:/var/lib/tor-shared
    # Deliberately no `ports:` — the SOCKS and control ports stay on the
    # internal network. Publishing them would expose an unauthenticated proxy
    # and a control channel to the host.
    networks:
      - password_manager_network
    restart: unless-stopped

  # Onion ingress listener. Same image and code as `backend`; the only thing
  # that makes it special is that it is reachable ONLY from the tor container
  # (no `ports:` mapping), which is what makes "this request came in over the
  # onion service" a fact rather than a client-supplied claim.
  backend-onion:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: password_manager_backend_onion
    profiles: ["tor"]
    command: daphne -b 0.0.0.0 -p 8443 password_manager.asgi:application
    volumes:
      - ./password_manager:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - tor_shared:/var/lib/tor-shared:ro
    environment:
      # Never DEBUG on the onion surface: this listener answers anonymous
      # clients, and a debug traceback would hand them settings and SQL.
      - DEBUG=false
      # Tor encrypts the circuit end to end and publishes this service on port
      # 80, so an https:// redirect would point anonymous clients at an
      # endpoint that does not exist. See the SECURE_SSL_REDIRECT comment in
      # settings/base.py — this override is for the onion listener only.
      - SECURE_SSL_REDIRECT=false
      - "SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}"
      - DATABASE_URL=postgresql://${DB_USER:-pm_user}:${DB_PASSWORD:-password123}@postgres:5432/${DB_NAME:-password_manager}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      # The leading dot matches every subdomain, which is how the generated
      # .onion address is accepted without knowing it in advance. Django
      # rejects any other Host, and a rejected Host is never onion ingress.
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1},.onion
      - USE_REDIS_CHANNELS=${USE_REDIS_CHANNELS:-false}
      - USE_REDIS_CACHE=${USE_REDIS_CACHE:-false}
      - OIDC_RP_CLIENT_ID=${OIDC_RP_CLIENT_ID:-}
      - OIDC_RP_CLIENT_SECRET=${OIDC_RP_CLIENT_SECRET:-}
      - OIDC_OP_BASE_URL=${OIDC_OP_BASE_URL:-https://accounts.google.com}
      - OIDC_VERIFY_SSL=${OIDC_VERIFY_SSL:-True}
      - OIDC_USE_NONCE=${OIDC_USE_NONCE:-True}
      - TOR_ENABLED=true
      # Compose puts every service on one bridge network, so "listens on 8443
      # with no published port" keeps the listener off the host but NOT away
      # from sibling containers. This pins the only peer whose connections may
      # be treated as onion ingress; without it a compromised sibling could
      # present the onion Host on 8443 and be labelled anonymous.
      - TOR_ONION_INGRESS_TRUSTED_PEERS=tor
      - TOR_CONTROL_HOST=tor
      - TOR_CONTROL_PORT=9051
      - "TOR_CONTROL_PASSWORD=${TOR_CONTROL_PASSWORD:?Set TOR_CONTROL_PASSWORD in .env to use the tor profile}"
      - TOR_SOCKS_HOST=tor
      - TOR_SOCKS_PORT=9050
      - TOR_ONION_HOSTNAME_FILE=/var/lib/tor-shared/hostname
      - TOR_ONION_INGRESS_PORT=8443
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-init:
        condition: service_completed_successfully
    networks:
      - password_manager_network
    restart: unless-stopped

  # Daphne WebSocket Server (ASGI)
  # NOTE: WebSocket service is OPTIONAL for basic functionality
  # It's only needed for real-time breach alerts and live sync features
  # For development without WebSockets, you can comment out this service
  websocket:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: password_manager_websocket
    command: daphne -b 0.0.0.0 -p 8001 password_manager.asgi:application
    volumes:
      - ./password_manager:/app
    ports:
      - "${WEBSOCKET_PORT:-8001}:8001"
    environment:
      - DEBUG=${DEBUG:-True}
      - "SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}"
      - DATABASE_URL=postgresql://${DB_USER:-pm_user}:${DB_PASSWORD:-password123}@postgres:5432/${DB_NAME:-password_manager}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - USE_REDIS_CHANNELS=${USE_REDIS_CHANNELS:-false}
      - USE_REDIS_CACHE=${USE_REDIS_CACHE:-false}
      # OpenID Connect (OIDC) Configuration
      - OIDC_RP_CLIENT_ID=${OIDC_RP_CLIENT_ID:-}
      - OIDC_RP_CLIENT_SECRET=${OIDC_RP_CLIENT_SECRET:-}
      - OIDC_OP_BASE_URL=${OIDC_OP_BASE_URL:-https://accounts.google.com}
    depends_on:
      - postgres
      - redis
    networks:
      - password_manager_network
    restart: unless-stopped

  # Celery Worker (Background Tasks)
  celery_worker:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: password_manager_celery_worker
    command: celery -A password_manager worker -l info --concurrency=4
    volumes:
      - ./password_manager:/app
      - media_volume:/app/media
    environment:
      - DEBUG=${DEBUG:-True}
      - "SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}"
      - DATABASE_URL=postgresql://${DB_USER:-pm_user}:${DB_PASSWORD:-password123}@postgres:5432/${DB_NAME:-password_manager}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      - USE_REDIS_CACHE=${USE_REDIS_CACHE:-false}
    depends_on:
      - postgres
      - redis
    networks:
      - password_manager_network
    restart: unless-stopped

  # Celery Beat (Periodic Task Scheduler)
  celery_beat:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: password_manager_celery_beat
    command: celery -A password_manager beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./password_manager:/app
    environment:
      - DEBUG=${DEBUG:-True}
      - "SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}"
      - DATABASE_URL=postgresql://${DB_USER:-pm_user}:${DB_PASSWORD:-password123}@postgres:5432/${DB_NAME:-password_manager}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      - USE_REDIS_CACHE=${USE_REDIS_CACHE:-false}
    depends_on:
      - postgres
      - redis
    networks:
      - password_manager_network
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: password_manager_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
      - VITE_WS_URL=${VITE_WS_URL:-ws://localhost:8001}
      - VITE_OIDC_ENABLED=${VITE_OIDC_ENABLED:-true}
    depends_on:
      - backend
      - websocket
    networks:
      - password_manager_network
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0

  # Nginx Reverse Proxy & Load Balancer
  nginx:
    image: nginx:1.27-alpine
    container_name: password_manager_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - websocket
      - frontend
    networks:
      - password_manager_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
  # Hidden-service private key and Tor state. Private to the tor container.
  # Persisting it is what keeps the .onion address stable across restarts;
  # deleting this volume issues a new address.
  tor_data:
    driver: local
  # Public .onion hostname only, so the backend can learn the address it
  # should expect without ever seeing the service's private key.
  tor_shared:
    driver: local

networks:
  password_manager_network:
    driver: bridge

