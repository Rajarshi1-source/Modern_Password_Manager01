# Gitleaks configuration: the default rules, plus allowlists for patterns the
# generic-api-key heuristic misreads. Fingerprints of individual historical
# findings stay in .gitleaksignore; an allowlist here holds across rebases,
# where a fingerprint (which includes the commit SHA) would not.

[extend]
useDefault = true

[[allowlists]]
description = "Django migration dependency lines, e.g. ('auth_module', '0015_ml_kem_768_defaults'),"
targetRules = ["generic-api-key"]
# AND: the line must match AND be in a migration (the default, OR, would
# allowlist every generic-api-key finding in any migration file)
condition = "AND"
paths = ['''(^|/)migrations/[^/]+\.py$''']
regexTarget = "line"
regexes = [
  '''^\s*\('[a-z][a-z0-9_]*',\s*'\d{4}_[a-z0-9_]+'\),?\s*$''',
]

[[allowlists]]
description = "Base64 of the text 'not-32-bytes', a malformed-hash test input in commit 4551d2e (the test now computes it)"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)auth_module/tests/test_login_verifier\.py$''']
regexTarget = "line"
regexes = [
  '''new_auth_hash='bm90LTMyLWJ5dGVz'\)''',
]
