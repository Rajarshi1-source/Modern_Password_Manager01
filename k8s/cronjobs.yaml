# =============================================================================
# K8s CronJobs — cluster-native scheduling for maintenance tasks that must
# run even when Celery beat is unhealthy.
#
# Image is ${BACKEND_IMAGE}:${GITHUB_SHA} -- BACKEND_IMAGE is the canonical
# ghcr.io/<repo>/backend name computed by ci.yml's setup job, not a
# hardcoded placeholder (CodeRabbit, PR #483: the CronJobs originally
# hardcoded ghcr.io/yourusername/password-manager/backend, which would
# never resolve to a real image and made every CronJob ImagePullBackOff).
# Deploy via:  envsubst < k8s/cronjobs.yaml | kubectl apply -f -
# Requires both BACKEND_IMAGE and GITHUB_SHA in the shell environment.
# =============================================================================

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cleanup-old-logs
  namespace: password-manager
  labels:
    app: password-manager
    component: maintenance
spec:
  schedule: "0 4 * * 0"  # Sunday 04:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: password-manager
            component: maintenance
            job: cleanup-old-logs
        spec:
          restartPolicy: OnFailure
          serviceAccountName: password-manager-sa
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
          containers:
          - name: cleanup
            image: ${BACKEND_IMAGE}:${GITHUB_SHA}
            command: ["python", "manage.py", "cleanup_old_logs"]
            envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
            resources:
              requests:
                cpu: "50m"
                memory: "128Mi"
              limits:
                cpu: "200m"
                memory: "256Mi"
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
  namespace: password-manager
  labels:
    app: password-manager
    component: maintenance
spec:
  schedule: "30 3 * * *"  # Daily 03:30 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: password-manager
            component: maintenance
            job: db-backup
        spec:
          restartPolicy: OnFailure
          serviceAccountName: password-manager-sa
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
          containers:
          - name: backup
            image: ${BACKEND_IMAGE}:${GITHUB_SHA}
            command: ["python", "manage.py", "db_backup", "--output", "/backups"]
            envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
            volumeMounts:
            - name: backup-volume
              mountPath: /backups
            - name: tmp
              mountPath: /tmp
            resources:
              requests:
                cpu: "100m"
                memory: "256Mi"
              limits:
                cpu: "500m"
                memory: "512Mi"
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
          volumes:
          - name: backup-volume
            emptyDir: {}
          - name: tmp
            emptyDir: {}

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: check-time-lock-backlog
  namespace: password-manager
  labels:
    app: password-manager
    component: maintenance
spec:
  # Daily is enough: a stuck/dead beat process building a Time-Lock backlog
  # is a slow-forming problem, not one that needs sub-hour detection. Clear
  # of cleanup-old-logs (Sun 04:00) and db-backup (daily 03:30).
  schedule: "0 6 * * *"  # Daily 06:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # A backlog finding (exit 1) is a real signal, not a transient
      # failure -- retrying the same read-only query doesn't make it
      # smaller. backoffLimit: 0 means one clean Failed job per scheduled
      # run instead of backoffLimit-many duplicate log entries for the
      # same finding.
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app: password-manager
            component: maintenance
            job: check-time-lock-backlog
        spec:
          restartPolicy: Never
          serviceAccountName: password-manager-sa
          # This Job only queries the app DB (see check_time_lock_backlog.py
          # -- zero Kubernetes API/client usage) and has no legitimate reason
          # to hold a K8s API token; mounting it anyway would be needless
          # attack surface if the container were ever compromised.
          automountServiceAccountToken: false
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
          containers:
          - name: check-time-lock-backlog
            image: ${BACKEND_IMAGE}:${GITHUB_SHA}
            command: ["python", "manage.py", "check_time_lock_backlog"]
            envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
            resources:
              requests:
                cpu: "50m"
                memory: "128Mi"
              limits:
                cpu: "200m"
                memory: "256Mi"
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
