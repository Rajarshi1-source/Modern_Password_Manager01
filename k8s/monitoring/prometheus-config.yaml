apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: password-manager
  labels:
    app: password-manager
    component: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager:9093']
    rule_files:
      - /etc/prometheus/rules/*.yml
    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [password-manager]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name
  alerts.yml: |
    groups:
      - name: password-manager
        rules:
          # Requires kube-state-metrics if you enable the kube-state-metrics scrape below.
          # - alert: BackendDeploymentReplicasMismatch
          #   expr: kube_deployment_spec_replicas{namespace="password-manager"} != kube_deployment_status_replicas_available{namespace="password-manager"}
          - alert: PrometheusScrapeDown
            expr: up{job="kubernetes-pods"} == 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Metrics scrape target down
              description: A pod that exposes /metrics is not responding to Prometheus (check pod, NetworkPolicy, or annotations).
          # Backups (db-backup CronJob). The timestamp is stamped only after the
          # encrypted file is fully written, fsynced and renamed into place, so
          # this measures backups KEPT, not attempts. Every backend pod exports
          # the same value from the database, hence max(). 0 = never succeeded.
          - alert: VaultBackupStale
            expr: time() - max by (backup) (vault_backup_last_success_timestamp_seconds) > 26 * 3600
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: No successful database backup for over 26 hours
              description: >-
                {{ $labels.backup }} last succeeded {{ $value | humanizeDuration }} ago
                (daily schedule). Check the db-backup CronJob's last Job, the
                db-backups PVC, and BACKUP_AGE_RECIPIENT in app-config.
          # The gauge disappears when no backend is scraped or the backend cannot
          # read BackupStatus; then VaultBackupStale cannot fire either.
          - alert: VaultBackupMetricMissing
            expr: absent(vault_backup_last_success_timestamp_seconds)
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: Backup freshness metric is missing
              description: >-
                vault_backup_last_success_timestamp_seconds has not been scraped for
                an hour, so backup staleness is not being monitored.
