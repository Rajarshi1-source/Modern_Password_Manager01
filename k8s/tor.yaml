# =============================================================================
# Tor — real anonymity transport for Dark Protocol (opt-in)
# =============================================================================
# Apply this alongside the main manifests to give the cluster a Tor daemon that
# publishes the backend as a v3 onion service, then set TOR_ENABLED="true" in
# k8s/configmap.yaml. Without it the Dark Protocol feature reports Unavailable,
# which is the honest state for a cluster with no anonymity transport.
#
# Provisioning the address:
#   1. kubectl apply -f k8s/tor.yaml
#   2. kubectl -n password-manager exec deploy/tor -- cat /var/lib/tor/hidden_service/hostname
#   3. Put that value in the app-config ConfigMap as TOR_ONION_HOSTNAME and set
#      TOR_ENABLED="true", then restart the backend deployments.
#
# Step 3 is explicit rather than a shared volume because the hostname file
# lives in the tor pod's PVC, and ReadWriteMany is not available on every
# cluster. The backend prefers TOR_ONION_HOSTNAME over the file for exactly
# this reason.
#
# The PVC is what keeps the .onion address stable across restarts: it holds the
# hidden-service private key. Deleting it issues a new address.
# =============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tor-data
  namespace: password-manager
  labels:
    app: password-manager
    component: tor
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# -----------------------------------------------------------------------------
# tor-secrets is deliberately NOT defined here.
#
# A committed placeholder is a real credential: applying the manifest unedited
# would give the namespace a control-port password that is public in this
# repository, which is equivalent to an unauthenticated control port for
# anything that can reach tor-service:9051. Create it out of band instead:
#
#   kubectl -n password-manager create secret generic tor-secrets \
#     --from-literal=TOR_CONTROL_PASSWORD="$(openssl rand -base64 32)"
#
# (or point an ExternalSecret/SealedSecret at the same key). The tor container
# refuses to start without it.
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tor
  namespace: password-manager
  labels:
    app: password-manager
    component: tor
spec:
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: two daemons must not publish the same onion
    # descriptor from the same key at once, and the PVC is ReadWriteOnce.
    type: Recreate
  selector:
    matchLabels:
      app: password-manager
      component: tor
  template:
    metadata:
      labels:
        app: password-manager
        component: tor
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 10080
        runAsGroup: 10080
        # fsGroup gives the pod ownership of the PVC, which is why the
        # entrypoint has nothing to chown when it runs unprivileged here.
        fsGroup: 10080
      containers:
      - name: tor
        image: ghcr.io/yourusername/password-manager/tor:${GITHUB_SHA}
        imagePullPolicy: Always
        env:
        - name: TOR_ONION_TARGET
          value: "backend-onion-service:8443"
        envFrom:
        - secretRef:
            name: tor-secrets
        ports:
        - containerPort: 9050
          name: socks
        - containerPort: 9051
          name: control
        volumeMounts:
        - name: tor-data
          mountPath: /var/lib/tor
        - name: tor-shared
          mountPath: /var/lib/tor-shared
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 10080
          runAsGroup: 10080
          # torrc is rendered into /tmp, which is an emptyDir, so the root
          # filesystem itself stays read-only.
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        # Bootstrapping a circuit from a cold start is slow, hence the long
        # start period. The probe asks Tor the same question the backend gates
        # on, so "ready" means the capability is genuinely usable.
        readinessProbe:
          exec:
            command: ["/usr/local/bin/entrypoint.sh", "healthcheck"]
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 20
        livenessProbe:
          exec:
            command: ["/usr/local/bin/entrypoint.sh", "healthcheck"]
          initialDelaySeconds: 300
          periodSeconds: 60
          timeoutSeconds: 10
          failureThreshold: 5
      volumes:
      - name: tor-data
        persistentVolumeClaim:
          claimName: tor-data
      - name: tor-shared
        emptyDir: {}
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tor-service
  namespace: password-manager
  labels:
    app: password-manager
    component: tor
spec:
  # ClusterIP only. Neither port may ever be exposed outside the cluster: the
  # SOCKS port is an open proxy to anything that can reach it, and the control
  # port reconfigures the daemon.
  type: ClusterIP
  selector:
    app: password-manager
    component: tor
  ports:
  - name: socks
    port: 9050
    targetPort: 9050
  - name: control
    port: 9051
    targetPort: 9051
---
# =============================================================================
# Onion ingress listener
# =============================================================================
# The same backend image on a different port, with NO Ingress and NO
# LoadBalancer in front of it. That is the whole point: port 8443 is reachable
# only from the tor pod, so a request arriving on it came through the onion
# service. The backend treats arriving on this port as the proof of anonymous
# ingress, which is why it must never be published.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-onion
  namespace: password-manager
  labels:
    app: password-manager
    component: backend-onion
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: password-manager
      component: backend-onion
  template:
    metadata:
      labels:
        app: password-manager
        component: backend-onion
    spec:
      serviceAccountName: password-manager-sa
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
      - name: backend
        image: ghcr.io/yourusername/password-manager/backend:${GITHUB_SHA}
        imagePullPolicy: Always
        command:
        - daphne
        - password_manager.asgi:application
        - --bind
        - 0.0.0.0
        - --port
        - "8443"
        ports:
        - containerPort: 8443
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secrets
        - secretRef:
            name: tor-secrets
        env:
        # ALLOWED_HOSTS from app-config lists the clearnet domains; the onion
        # address has to be accepted here too or Django rejects the Host header
        # and the request is (correctly) never treated as onion ingress.
        # The leading dot matches the generated address without hardcoding it.
        - name: ALLOWED_HOSTS
          value: "$(ALLOWED_HOSTS),.onion"
        # Tor publishes this service on port 80 and encrypts the circuit end
        # to end, so the production HTTPS redirect must be off here: it would
        # send every anonymous request to an https:// endpoint that does not
        # exist. Clearnet listeners keep the default. See settings/base.py.
        - name: SECURE_SSL_REDIRECT
          value: "false"
        volumeMounts:
        - name: media-files
          mountPath: /app/media
        - name: tmp
          mountPath: /tmp
        - name: app-logs
          mountPath: /app/logs
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /live/
            port: 8443
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready/
            port: 8443
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
      volumes:
      - name: media-files
        persistentVolumeClaim:
          claimName: media-files
      - name: tmp
        emptyDir: {}
      - name: app-logs
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend-onion-service
  namespace: password-manager
  labels:
    app: password-manager
    component: backend-onion
spec:
  type: ClusterIP
  selector:
    app: password-manager
    component: backend-onion
  ports:
  - name: http
    port: 8443
    targetPort: 8443
---
# =============================================================================
# NetworkPolicies
# =============================================================================
# k8s/network-policy.yaml applies a namespace-wide default-deny for BOTH
# ingress and egress, and its postgres/redis policies admit only
# component: backend|websocket|celery-*. So every flow this feature needs must
# be granted explicitly here, or the Tor path cannot become healthy at all.
# Policies are additive, so these grants live with the opt-in feature instead
# of editing the base manifest.
#
# The first policy is also a security control, not just connectivity: it is
# what makes "arrived on port 8443" evidence of anonymous ingress inside the
# cluster, since pod IPs are dynamic and cannot be listed in configuration
# (which is what TOR_ONION_INGRESS_TRUSTED_PEERS does under docker-compose).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-onion-ingress
  namespace: password-manager
  labels:
    app: password-manager
    component: backend-onion
spec:
  podSelector:
    matchLabels:
      app: password-manager
      component: backend-onion
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: password-manager
          component: tor
    ports:
    - protocol: TCP
      port: 8443
---
# The onion ingress listener needs the same backing services as the clearnet
# backend, plus the Tor control/SOCKS ports.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-onion-egress
  namespace: password-manager
  labels:
    app: password-manager
    component: backend-onion
spec:
  podSelector:
    matchLabels:
      app: password-manager
      component: backend-onion
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          component: database
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          component: cache
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - podSelector:
        matchLabels:
          component: tor
    ports:
    - protocol: TCP
      port: 9050
    - protocol: TCP
      port: 9051
---
# Postgres and Redis admit only the components listed in the base manifest;
# backend-onion is not among them, so it is added here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-from-backend-onion
  namespace: password-manager
  labels:
    app: password-manager
    component: backend-onion
spec:
  podSelector:
    matchLabels:
      app: password-manager
      component: database
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          component: backend-onion
    ports:
    - protocol: TCP
      port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-from-backend-onion
  namespace: password-manager
  labels:
    app: password-manager
    component: backend-onion
spec:
  podSelector:
    matchLabels:
      app: password-manager
      component: cache
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          component: backend-onion
    ports:
    - protocol: TCP
      port: 6379
---
# The clearnet backend reads Tor state so it can show users the .onion
# address; without this its capability probe cannot reach the control port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-egress-to-tor
  namespace: password-manager
  labels:
    app: password-manager
    component: backend
spec:
  podSelector:
    matchLabels:
      app: password-manager
      component: backend
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          component: tor
    ports:
    - protocol: TCP
      port: 9050
    - protocol: TCP
      port: 9051
---
# Tor itself: its ports are reachable only from the two backends (the SOCKS
# port is an open proxy to anything that can reach it), and it must be able to
# egress to the Tor network and forward into the onion ingress listener.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tor-policy
  namespace: password-manager
  labels:
    app: password-manager
    component: tor
spec:
  podSelector:
    matchLabels:
      app: password-manager
      component: tor
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          component: backend
    - podSelector:
        matchLabels:
          component: backend-onion
    ports:
    - protocol: TCP
      port: 9050
    - protocol: TCP
      port: 9051
  egress:
  # Relays live on arbitrary addresses and ORPorts across the public internet,
  # so this cannot be narrowed to a host or port list — it is inherent to
  # running a Tor client. DNS is already granted namespace-wide by
  # k8s/network-policy.yaml.
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
  - to:
    - podSelector:
        matchLabels:
          component: backend-onion
    ports:
    - protocol: TCP
      port: 8443
