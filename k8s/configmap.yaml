# =============================================================================
# Kubernetes ConfigMap - Application Configuration
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: password-manager
  labels:
    app: password-manager
data:
  # Django Settings
  DJANGO_SETTINGS_MODULE: "password_manager.settings"
  DEBUG: "False"
  ALLOWED_HOSTS: "yourapp.com,www.yourapp.com,api.yourapp.com"
  
  # Database
  DATABASE_HOST: "postgres-service"
  DATABASE_NAME: "password_manager"
  # TLS to PostgreSQL. libpq's default ("prefer") silently falls back to an
  # UNENCRYPTED connection when the server does not offer TLS, which for this
  # application means vault ciphertext, auth hashes and session data crossing
  # the cluster network in the clear with nothing logged.
  #
  # This SHOULD be "require". It is deliberately "prefer" today because the
  # PostgreSQL Deployment in deployment.yaml runs the stock postgres image with
  # no TLS: no `-c ssl=on`, no server certificate or key mounted. PostgreSQL
  # ships with `ssl = off`, so a client asking for "require" is refused with
  # "server does not support SSL, but SSL was required" -- and since the
  # DATABASE_* fix means these pods now genuinely talk to PostgreSQL instead of
  # silently using SQLite, that would fail the migrate Job, the collectstatic
  # init container and every backend pod, i.e. block the whole rollout.
  #
  # TO TURN THIS ON (do both, in this order):
  #   1. Give the server TLS. Mount a certificate/key Secret into the postgres
  #      container and start it with
  #        -c ssl=on -c ssl_cert_file=... -c ssl_key_file=...
  #      The key must be mode 0600 and owned by the postgres user or the server
  #      refuses to start, so a cert-manager Secret needs defaultMode: 0600
  #      (cluster-issuer.yaml already provides an issuer).
  #   2. Only then set this to "require" -- or better "verify-full" together
  #      with DATABASE_SSLROOTCERT, since "require" encrypts but does not
  #      authenticate the server.
  DB_SSLMODE: "prefer"
  
  # Redis
  REDIS_HOST: "redis-service"
  USE_REDIS_CHANNELS: "true"
  USE_REDIS_CACHE: "true"
  
  # Celery
  CELERY_BROKER_URL: "redis://redis-service:6379/1"
  CELERY_RESULT_BACKEND: "redis://redis-service:6379/2"
  
  # URLs
  FRONTEND_URL: "https://yourapp.com"
  CORS_ALLOWED_ORIGINS: "https://yourapp.com,https://www.yourapp.com"
  CSRF_TRUSTED_ORIGINS: "https://yourapp.com,https://www.yourapp.com"
  
  # Behavioral Recovery
  BEHAVIORAL_RECOVERY_ENABLED: "true"
  QUANTUM_CRYPTO_ENABLED: "true"
  
  # Blockchain
  BLOCKCHAIN_ENABLED: "false"
  BLOCKCHAIN_NETWORK: "testnet"
  
  # Performance
  GUNICORN_WORKERS: "4"
  GUNICORN_THREADS: "2"
  CELERY_CONCURRENCY: "4"

  # Tor — anonymity transport for Dark Protocol (see k8s/tor.yaml).
  # "false" here means the cluster has no Tor daemon, so the feature reports
  # Unavailable. Apply k8s/tor.yaml and flip this to "true" to enable it.
  TOR_ENABLED: "false"
  TOR_CONTROL_HOST: "tor-service"
  TOR_CONTROL_PORT: "9051"
  TOR_SOCKS_HOST: "tor-service"
  TOR_SOCKS_PORT: "9050"
  # Set this to the address printed by the provisioning step in k8s/tor.yaml.
  # There is no hostname-file equivalent here: that file lives on the tor pod's
  # own volume and backend pods cannot read it, so pointing at a path they do
  # not have would only produce an unreadable-file warning on every probe.
  # TOR_ONION_HOSTNAME: "<56-char-address>.onion"
  # The port the onion service forwards to. Reachable only from the tor pod
  # via NetworkPolicy — that is what makes onion ingress detectable.
  TOR_ONION_INGRESS_PORT: "8443"

