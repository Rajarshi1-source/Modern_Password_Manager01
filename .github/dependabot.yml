version: 2
# Weekly version updates. Minor/patch bumps are grouped into one PR per
# ecosystem/directory; majors arrive one per PR. Exception: the pip
# crypto-stack group has no update-types filter, so its packages' majors
# (cryptography, pyOpenSSL, fido2, PyJWT) can arrive together in one PR,
# on purpose, since they cap each other. Nothing here enables auto-merge:
# every PR still needs CI and a human merge.
updates:
  # Smart contracts (npm)
  - package-ecosystem: "npm"
    directory: "/contracts"
    schedule:
      interval: "weekly"
    # Hold new releases for a week before proposing them, so a hijacked or
    # yanked release is usually caught upstream first. Security updates are
    # not delayed by cooldown.
    cooldown:
      default-days: 7
    groups:
      # One weekly PR for all minor/patch bumps. Major bumps are not grouped:
      # each arrives as its own PR for manual review. Security updates stay
      # separate PRs too (groups default to version updates only).
      contracts-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # tmp is pinned via overrides because patch-package@6.5.1 (via @chainlink/contracts)
      # constrains it to ^0.0.33. Remove this ignore when @chainlink/contracts upgrades patch-package.
      - dependency-name: "tmp"
        versions: ["< 0.2.4"]

  # Frontend (npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Hold new releases for a week before proposing them, so a hijacked or
    # yanked release is usually caught upstream first. Security updates are
    # not delayed by cooldown.
    cooldown:
      default-days: 7
    groups:
      # One weekly PR for all minor/patch bumps. Major bumps are not grouped:
      # each arrives as its own PR for manual review. Security updates stay
      # separate PRs too (groups default to version updates only).
      frontend-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Backend Python dependencies (pip)
  - package-ecosystem: "pip"
    directory: "/password_manager"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Hold new releases for a week before proposing them, so a hijacked or
    # yanked release is usually caught upstream first. Security updates are
    # not delayed by cooldown.
    cooldown:
      default-days: 7
    groups:
      # Everything except the crypto stack below: one weekly minor/patch PR.
      # Dependabot puts a dependency in the FIRST group it matches, so the
      # crypto packages are excluded here to keep them in crypto-stack.
      pip-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "cryptography"
          - "pyopenssl"
          - "fido2"
          - "pyjwt"
        update-types:
          - "minor"
          - "patch"
      # These cap each other (pyOpenSSL <cryptography+1 major, fido2 likewise), so a
      # lone bump of any one produces a PR that cannot resolve. Update them together;
      # .github/workflows/dependency-compat.yml then checks the combined result.
      crypto-stack:
        patterns:
          - "cryptography"
          - "pyopenssl"
          - "fido2"
          - "pyjwt"
    ignore:
      # Pinned on purpose to pair with liboqs (C) 0.16.0: both are built from
      # pinned git SHAs in docker/backend/Dockerfile, and the lock line only
      # documents the image. A bump of this line alone would make the lock disagree
      # with the image (the C library and the ctypes wrapper must move together),
      # so upgrades are done by hand in the Dockerfile, where oqs_smoke.py checks
      # the pairing at build time. See DEPENDENCY_POLICY.md.
      - dependency-name: "liboqs-python"

  # Docker base images — backend
  - package-ecosystem: "docker"
    directory: "/docker/backend"
    schedule:
      interval: "weekly"
    # Hold new releases for a week before proposing them, so a hijacked or
    # yanked release is usually caught upstream first. Security updates are
    # not delayed by cooldown.
    cooldown:
      default-days: 7
    groups:
      # One weekly PR for all minor/patch bumps. Major bumps are not grouped:
      # each arrives as its own PR for manual review. Security updates stay
      # separate PRs too (groups default to version updates only).
      docker-backend-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Docker base images — frontend (production)
  - package-ecosystem: "docker"
    directory: "/docker/frontend"
    schedule:
      interval: "weekly"
    # Hold new releases for a week before proposing them, so a hijacked or
    # yanked release is usually caught upstream first. Security updates are
    # not delayed by cooldown.
    cooldown:
      default-days: 7
    groups:
      # One weekly PR for all minor/patch bumps. Major bumps are not grouped:
      # each arrives as its own PR for manual review. Security updates stay
      # separate PRs too (groups default to version updates only).
      docker-frontend-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Docker base images — backend prod
  - package-ecosystem: "docker"
    directory: "/password_manager"
    schedule:
      interval: "weekly"
    # Hold new releases for a week before proposing them, so a hijacked or
    # yanked release is usually caught upstream first. Security updates are
    # not delayed by cooldown.
    cooldown:
      default-days: 7
    groups:
      # One weekly PR for all minor/patch bumps. Major bumps are not grouped:
      # each arrives as its own PR for manual review. Security updates stay
      # separate PRs too (groups default to version updates only).
      docker-backend-prod-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Hold new releases for a week before proposing them, so a hijacked or
    # yanked release is usually caught upstream first. Security updates are
    # not delayed by cooldown.
    cooldown:
      default-days: 7
    groups:
      # One weekly PR for all minor/patch bumps. Major bumps are not grouped:
      # each arrives as its own PR for manual review. Security updates stay
      # separate PRs too (groups default to version updates only).
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
