version: 2
updates:
  # Smart contracts (npm)
  - package-ecosystem: "npm"
    directory: "/contracts"
    schedule:
      interval: "weekly"
    ignore:
      # tmp is pinned via overrides because patch-package@6.5.1 (via @chainlink/contracts)
      # constrains it to ^0.0.33. Remove this ignore when @chainlink/contracts upgrades patch-package.
      - dependency-name: "tmp"
        versions: ["< 0.2.4"]

  # Frontend (npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Backend Python dependencies (pip)
  - package-ecosystem: "pip"
    directory: "/password_manager"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # These cap each other (pyOpenSSL <cryptography+1 major, fido2 likewise), so a
      # lone bump of any one produces a PR that cannot resolve. Update them together;
      # .github/workflows/dependency-compat.yml then checks the combined result.
      crypto-stack:
        patterns:
          - "cryptography"
          - "pyopenssl"
          - "fido2"
          - "pyjwt"
    ignore:
      # Pinned on purpose to pair with liboqs (C) 0.11.0, built from pinned git
      # SHAs in docker/backend/Dockerfile (PyPI only publishes the 0.16.x line, so
      # a bump of this lock line alone would make the lock disagree with the image).
      # Upgrading is a deliberate migration (Kyber round 3 -> ML-KEM, real-liboqs CI),
      # not a version bump: see docs/pqc-hybrid-architecture-review.md.
      - dependency-name: "liboqs-python"

  # Docker base images — backend
  - package-ecosystem: "docker"
    directory: "/docker/backend"
    schedule:
      interval: "weekly"

  # Docker base images — frontend (production)
  - package-ecosystem: "docker"
    directory: "/docker/frontend"
    schedule:
      interval: "weekly"

  # Docker base images — backend prod
  - package-ecosystem: "docker"
    directory: "/password_manager"
    schedule:
      interval: "weekly"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
