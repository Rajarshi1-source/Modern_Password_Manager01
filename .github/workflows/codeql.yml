name: CodeQL Analysis

# =============================================================================
# CodeQL Advanced Setup
#
# Language notes
# ──────────────
# Python + JavaScript/TypeScript: interpreted → build-mode: none works fine.
#
# GitHub Actions (workflow YAML): no compilation step exists for this
# "language" either → build-mode: none.
#
# Java/Kotlin (android module) and Swift (iOS module) are both library-only
# Expo native modules that depend on expo-modules-core and require the full
# React Native host project to compile.  They cannot be built in isolation,
# so they are intentionally excluded from CodeQL to avoid fatal build errors.
#
# Ruby: not present in this repository → excluded.
# =============================================================================

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 3 * * 1'  # weekly on Monday at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # ---------------------------------------------------------------------------
  # 2026-09-16: GitHub's default CodeQL setup was disabled repo-wide via
  #
  #   gh api -X PATCH /repos/<owner>/<repo>/code-scanning/default-setup \
  #     -f state=not-configured
  #
  # which an account with admin on the repo (unlike the workflow's own
  # GITHUB_TOKEN, which returned HTTP 403 on this endpoint) can run
  # one-time from outside CI. Default setup and this advanced workflow
  # produced duplicate "Analyze (python)" / "Analyze (javascript-typescript)"
  # check rows on every PR -- one pass (default setup), one hard-fail
  # (this workflow's SARIF upload, rejected with "CodeQL analyses from
  # advanced configurations cannot be processed when the default setup
  # is enabled") -- which is why `pull_request` was dropped below for a
  # while. With default setup off, the conflict is gone and the trigger
  # is restored so PRs get this workflow's security-extended suite and
  # custom paths-ignore (see .github/codeql/codeql-config.yml) instead
  # of default setup's narrower `default` query suite.
  # ---------------------------------------------------------------------------
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          # Added 2026-09-16 alongside the default-setup switch above --
          # default setup's language list included `actions`, so this
          # keeps GitHub Actions workflow-file scanning from regressing
          # now that default setup is off.
          - language: actions
            build-mode: none

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # Audit-only: observes and logs egress without blocking any
          # requests. This job needs to reach github.com (checkout,
          # CodeQL DB uploads) and objects.githubusercontent.com (tool
          # downloads); audit mode surfaces anything beyond that in the
          # job summary without risking a false-positive block on a
          # security-critical workflow.
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # See .github/codeql/codeql-config.yml for the rationale on
          # the (narrow) paths-ignore list — protocol-mandated SHA-1
          # in HIBP files and a pytest orchestrator shim.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          category: /language:${{ matrix.language }}
