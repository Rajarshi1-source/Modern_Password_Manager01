name: Security & Supply Chain Audit

on:
  pull_request:
  push:
    branches: [ "main" ]
  schedule:
    - cron: "0 3 * * 1"  # weekly

# Read-only default for the GITHUB_TOKEN. Every job below declares the
# permissions it needs, so this only covers a job added without one.
permissions:
  contents: read

jobs:
  adaptive-zk-guard:
    name: Adaptive password zero-knowledge guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: No raw-password fields in adaptive client code
        run: bash scripts/check-adaptive-zk-client.sh

  security:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: 'password_manager/requirements.txt'

      - name: Install tools
        run: |
          pip install --upgrade pip
          # Secondary guard for this step's own env: keep setuptools<81 so
          # `pkg_resources` stays importable (setuptools 81 removed it, and the
          # legacy cyclonedx-bom (<2) `cyclonedx-py` CLI imports it at startup).
          # The root-cause fix is the matching `setuptools<81` ceiling in
          # requirements-constraints.txt — that governs the later prod install,
          # which otherwise re-resolves setuptools past 81 before the SBOM step.
          pip install "safety==2.3.5" "cyclonedx-bom>=1.4.3,<2" "setuptools<81"

      - name: Dependency install (prod)
        run: |
          cd password_manager
          pip install \
            -r requirements-prod.txt \
            -c requirements-constraints.txt

      - name: pip-audit
        run: |
          pip-audit || true

      - name: safety scan
        run: |
          safety check --full-report || true

      - name: SBOM generation
        run: |
          cyclonedx-py -r -i password_manager/requirements-prod.txt --format json -o sbom.json

      - name: Verify SBOM exists
        run: |
          if [ ! -f sbom.json ]; then
            echo "ERROR: sbom.json not found — SBOM generation failed" >&2
            exit 1
          fi
          echo "SBOM generated successfully ($(wc -c < sbom.json) bytes)"

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.json
