name: k6 Load Test

# =============================================================================
# Scheduled / on-demand k6 smoke-load test against a locally-booted backend.
# Never runs on push or pull_request — a load test has no business gating
# a merge, and running it on every PR would also contend with whatever else
# is scheduled on shared GitHub-hosted runners.
#
# The service-container + "start your service" boot sequence below is
# copied from the proven pattern in stackhawk.yml (Postgres 17 + pgvector,
# Redis 7, disk cleanup for the ML dependency stack, migrate, runserver in
# the background, health-check poll) rather than the docker-compose
# approach sast-dast.yml's Nuclei job uses, which is already soft-failed
# there (`|| echo "docker compose up failed"`) and therefore not proven
# reliable enough to build a new workflow on.
# =============================================================================

on:
  schedule:
    - cron: '45 6 * * 1'  # weekly on Monday at 06:45 UTC
  workflow_dispatch: {}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  k6-load-test:
    name: k6 Vault Smoke Load Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Free disk space on runner
        # Same disk-exhaustion risk as ci.yml/stackhawk.yml during pip
        # install of the ML dependency stack.
        run: |
          set -eu
          df -h /
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          docker image prune -a -f || true
          df -h /

      - name: Install dependencies
        run: |
          cd password_manager
          python -m pip install --no-cache-dir --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Start Django server
        env:
          DEBUG: 'True'
          SECRET_KEY: 'k6-load-test-secret-key-not-for-production'
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DATABASE_URL: postgresql://test_user:test_password@127.0.0.1:5432/test_db
          REDIS_URL: redis://127.0.0.1:6379/0
          ALLOWED_HOSTS: '*'
        run: |
          cd password_manager
          python manage.py migrate --noinput
          python manage.py runserver 0.0.0.0:8000 &
          # Bounded polling instead of a fixed sleep + best-effort curl: the
          # previous `sleep 10; curl -f ... || echo` masked a failed check
          # (job kept going either way) and could let k6 start hammering a
          # server that wasn't listening yet. This fails the step outright
          # if Django never becomes ready within 60s.
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --connect-timeout 2 --max-time 5 http://localhost:8000/api/health/; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Django server did not become ready" >&2
              exit 1
            fi
            sleep 2
          done

      - name: Set up k6
        uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1.2.1
        with:
          # Pinned deliberately: setup-k6-action defaults to whatever k6
          # release is newest at run time, which could silently change this
          # weekly smoke test's behavior or summary metrics without a repo
          # change. Bump intentionally when reviewed.
          k6-version: '2.2.0'

      - name: Run k6 load test
        id: k6
        # grafana/k6-action (previously used here) is archived/unmaintained
        # upstream; setup-k6-action + run-k6-action is the actively
        # maintained replacement it explicitly points to.
        uses: grafana/run-k6-action@de51a7390bdf0ac85a3bef493691bd71d4c7c158 # v1.4.0
        continue-on-error: true
        with:
          path: tests/load/k6-vault-smoke.js
          flags: --summary-export=k6-summary.json
        env:
          K6_BASE_URL: http://localhost:8000

      - name: Upload k6 summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: k6-summary
          path: k6-summary.json
          if-no-files-found: ignore
          retention-days: 30
