# =============================================================================
# Supplemental SAST/DAST Scanners
# =============================================================================
# Complements the existing scanner fleet (Trivy, Grype, Gitleaks, CodeQL,
# Bandit, Safety, pip-audit, Syft, Cosign, Codacy, Snyk) with:
#   * Semgrep         - higher-signal SAST across Python/JS/TS/Dockerfiles
#   * Nuclei          - template-based DAST against a locally-booted stack
#
# Heavy commercial tools (Burp, Nessus, Acunetix, Detectify, Intruder, etc.)
# are out of scope for this free-tier workflow and are documented in
# docs/security-tooling.md instead.
# =============================================================================

name: SAST / DAST Supplemental

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop]
  schedule:
    # Nightly re-scan so newly published templates catch regressions.
    - cron: '17 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Semgrep - multi-language SAST
  # ---------------------------------------------------------------------------
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    # step-security/harden-runner is intentionally NOT added to this job:
    # it patches the runner's own network namespace and does not work
    # inside a `container:` job (this one runs in returntocorp/semgrep).
    # It is present on the nuclei job below and elsewhere in the repo's
    # other non-containerized security workflows.
    container:
      image: returntocorp/semgrep:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run Semgrep (p/ci + p/security-audit + p/owasp-top-ten)
        run: |
          semgrep ci \
            --config p/ci \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config p/django \
            --config p/react \
            --config p/typescript \
            --config p/dockerfile \
            --sarif --output=semgrep.sarif || true
        env:
          # Optional: set SEMGREP_APP_TOKEN in repo secrets to get Pro rules
          # and dashboards. Workflow falls back to OSS rules if unset.
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ---------------------------------------------------------------------------
  # Nuclei - template-based DAST
  # ---------------------------------------------------------------------------
  nuclei:
    name: Nuclei DAST
    runs-on: ubuntu-latest
    # The local boot builds the backend image (liboqs + ML layer): allow for it,
    # but never the 6h default if something hangs.
    timeout-minutes: 90
    # Only run on scheduled and main-branch pushes — Nuclei is noisy on PRs.
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # The local boot builds the full backend image (tensorflow, torch, a liboqs
      # stage), which does not fit in the ~14 GB free on ubuntu-latest: the build
      # fails with "no space left on device" during the final COPY of /opt/venv
      # (see backend-ci.yml, ci-sbom.yml). Same reclaim as ci-sbom.yml.
      - name: Free up disk space
        if: ${{ vars.NUCLEI_TARGET == '' }}
        run: |
          sudo rm -rf /usr/local/lib/android \
                      /usr/share/dotnet \
                      /opt/ghc \
                      /opt/hostedtoolcache/CodeQL \
                      "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h

      # Boot the local stack only when scanning the local target. With the
      # NUCLEI_TARGET repo variable set, the hosted target is scanned instead and
      # nothing here is needed.
      - name: Boot ephemeral backend for scanning
        if: ${{ vars.NUCLEI_TARGET == '' }}
        run: |
          set -euo pipefail

          # docker-compose.yml REQUIRES SECRET_KEY and DB_PASSWORD (`${VAR:?...}`),
          # and TOR_CONTROL_PASSWORD too: compose interpolates the whole file, so
          # the tor-profile services' guard fires even though that profile is not
          # started. This step used to set none of them, so `compose up` always
          # failed and the failure was swallowed by `|| echo`, leaving Nuclei to
          # scan nothing. Throwaway values for this run only; masked so they
          # never print.
          SECRET_KEY="$(openssl rand -hex 32)"
          DB_PASSWORD="$(openssl rand -hex 16)"
          REDIS_PASSWORD="$(openssl rand -hex 16)"
          TOR_CONTROL_PASSWORD="$(openssl rand -hex 16)"
          for v in "$SECRET_KEY" "$DB_PASSWORD" "$REDIS_PASSWORD" "$TOR_CONTROL_PASSWORD"; do
            echo "::add-mask::$v"
          done

          # DEBUG=True on purpose, for this scan target only. With DEBUG=False the
          # app 301-redirects plain HTTP to HTTPS (there is no TLS here, so Nuclei
          # would scan redirects) and requires JWT_PRIVATE_KEY, which the compose
          # file does not forward. The findings therefore describe a debug-mode
          # backend, not production; scan a deployed target via NUCLEI_TARGET for that.
          {
            echo "SECRET_KEY=$SECRET_KEY"
            echo "DB_PASSWORD=$DB_PASSWORD"
            echo "REDIS_PASSWORD=$REDIS_PASSWORD"
            echo "TOR_CONTROL_PASSWORD=$TOR_CONTROL_PASSWORD"
            echo "DEBUG=True"
          } >> "$GITHUB_ENV"
          export SECRET_KEY DB_PASSWORD REDIS_PASSWORD TOR_CONTROL_PASSWORD DEBUG=True

          dump_logs() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              docker compose -f docker-compose.yml ps -a || true
              docker compose -f docker-compose.yml logs --no-color --tail=200 || true
            fi
          }
          trap dump_logs EXIT

          # `backend` pulls in postgres, redis and the migrate/collectstatic init.
          # The frontend is not booted: the scan target is the API on :8000.
          docker compose -f docker-compose.yml up -d backend

          # Fail the job unless the API reports healthy. /api/health/ returns 200
          # only when its database and cache checks pass (503 otherwise), so a
          # 4xx/5xx means the target is broken and scanning it would just be
          # scanning an error page.
          code=000
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/health/ || true)"
            case "$code" in
              2??)
                echo "Backend healthy (HTTP $code) after ~$((i * 5))s"
                exit 0
                ;;
            esac
            sleep 5
          done
          echo "::error title=Nuclei target did not start::http://localhost:8000/api/health/ never returned 2xx in 5 minutes (last HTTP $code); container logs are above."
          exit 1

      - name: Run Nuclei
        uses: projectdiscovery/nuclei-action@cc153d0541e1adf8a42bbe31c0a4fb2376147538 # v3.1.1
        with:
          cache: false
          args: >-
            -target ${{ vars.NUCLEI_TARGET || 'http://localhost:8000' }}
            -severity critical,high,medium
            -timeout 10
            -retries 1
            -silent
            -sarif-export nuclei.sarif
            -jsonl-export nuclei-output.json

      - name: Check for Nuclei SARIF
        id: nuclei_sarif
        if: always()
        run: |
          if [ -s nuclei.sarif ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::nuclei.sarif not produced (target unreachable or no findings) — skipping SARIF upload."
          fi

      - name: Upload Nuclei SARIF to code scanning
        if: always() && steps.nuclei_sarif.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: nuclei.sarif
          category: nuclei-dast

      - name: Upload Nuclei results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuclei-results
          path: |
            nuclei-output.json
            nuclei.sarif
          if-no-files-found: ignore
          retention-days: 14
