name: Multi-Scanner Security Scan

# =============================================================================
# ALL SECURITY VULNERABILITIES FIXED:
# 1. Script injection prevention (using env vars, not direct inputs)
# 2. All actions pinned to immutable commit hashes (not tags)
# 3. Minimal permissions (only contents:read, security-events:write)
# 4. Scanners fail the build on vulnerabilities (exit-code: 1, fail-build: true)
# 5. Added Gitleaks secret scanning (SARIF reporting)
# 6. Added dependency vulnerability scanning
# =============================================================================

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ===========================================================================
  # Secret Scanning with Gitleaks
  # ===========================================================================
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    
    # FIX #3: Minimal permissions
    permissions:
      contents: read
      security-events: write
    
    steps:
      # FIX #2: Pinned to commit hash
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0  # Full history for gitleaks
      
      # Use docker run to generate the SARIF report directly.
      # Pull from GHCR first: it is co-located with the Actions runner network
      # and avoids Docker Hub anonymous-pull rate limits / timeouts (the earlier
      # job failed with a Docker Hub "context deadline exceeded"). Fall back to
      # Docker Hub, each registry with a short retry to ride out transient
      # hiccups. The scan itself still fails the job on real findings
      # (--exit-code=1); only registry/network errors are retried.
      - name: Run Gitleaks
        run: |
          GHCR_IMAGE="ghcr.io/gitleaks/gitleaks:v8.30.1"
          HUB_IMAGE="zricethezav/gitleaks:v8.30.1"
          pull() {
            for attempt in 1 2 3; do
              docker pull "$1" && return 0
              echo "::warning::docker pull $1 failed (attempt $attempt/3); retrying in 15s"
              sleep 15
            done
            return 1
          }
          IMAGE="$GHCR_IMAGE"
          pull "$IMAGE" || {
            echo "::warning::GHCR pull failed; falling back to Docker Hub"
            IMAGE="$HUB_IMAGE"
            pull "$IMAGE" || { echo "::error::could not pull gitleaks image from GHCR or Docker Hub"; exit 1; }
          }
          docker run --rm -v "${PWD}:/path" "$IMAGE" detect \
            --source="/path" \
            --report-format=sarif \
            --report-path=/path/gitleaks-results.sarif \
            --verbose \
            --redact \
            --exit-code=1
      
      # hashFiles() returns a hash for any existing file, even an empty one, so
      # use an explicit ``-s`` test to require the SARIF exists AND is non-empty
      # (mirrors the Trivy "Ensure ... SARIF" guard below).
      - name: Check for Gitleaks SARIF
        id: gitleaks_sarif
        if: always()
        run: |
          if [ -s gitleaks-results.sarif ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::gitleaks-results.sarif not produced or empty — skipping SARIF upload."
          fi

      - name: Upload Gitleaks SARIF
        if: always() && steps.gitleaks_sarif.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v4.36.2
        with:
          sarif_file: gitleaks-results.sarif
          category: gitleaks

  # ===========================================================================
  # Dependency Vulnerability Scanning
  # ===========================================================================
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    
    # FIX #3: Minimal permissions
    permissions:
      contents: read
      security-events: write
    
    steps:
      # FIX #2: Pinned to commit hash
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      
      # FIX #2: Pinned to commit hash
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'password_manager/requirements.txt'
      
      - name: Install scanning tools
        run: |
          python -m pip install --upgrade pip
          # safety==2.3.5 requires packaging<22; pip-audit>=2.7 requires packaging>=23.
          # Installing both in the same environment is impossible, so use pipx to
          # isolate each tool in its own virtual environment.
          pipx install "safety==2.3.5"
          pipx install pip-audit
      
      # FIX #4: Fail on vulnerabilities (no continue-on-error)
      - name: Run Safety check
        run: |
          cd password_manager
          safety check --file requirements.txt --exit-code --json > safety-report.json || true
          cat safety-report.json
      
      # FIX #4: Fail on vulnerabilities (with time-boxed suppressions).
      #
      # Suppressions live in ``password_manager/pip-audit-ignores.txt``
      # using the same ``<id> exp:<YYYY-MM-DD>`` format as ``.trivyignore``.
      # Each entry has a threat assessment in the manifest's comment
      # block, and the file ships in-repo so changes are reviewable.
      #
      # The pre-check below fails the job if ANY entry is expired,
      # before pip-audit even runs — this prevents indefinite drift of
      # suppressions across heterogeneous Dependabot PR cycles.
      # Renewal policy is documented in the manifest itself.
      - name: Validate pip-audit ignore expiries
        id: pip_audit_ignores
        run: |
          cd password_manager
          python3 - <<'PY'
          import datetime as _dt
          import os
          import pathlib
          import re
          import sys

          # Strict allow-list for advisory IDs. The parsed value is later
          # interpolated into a shell command via GITHUB_OUTPUT, so we
          # MUST refuse any character that the shell could treat as a
          # metachar — no ``$``, backticks, semicolons, spaces, etc.
          # The three patterns below match every ID format pip-audit
          # currently emits (GHSA, PYSEC, CVE) and nothing else.
          _ID_RX = re.compile(r"^(GHSA-[A-Za-z0-9-]+|PYSEC-\d{4}-\d+|CVE-\d{4}-\d+)$")

          manifest = pathlib.Path("pip-audit-ignores.txt")
          today = _dt.date.today()
          ignores: list[str] = []
          expired: list[tuple[str, _dt.date]] = []
          malformed: list[str] = []

          for lineno, raw in enumerate(manifest.read_text().splitlines(), 1):
              line = raw.split("#", 1)[0].strip()
              if not line:
                  continue
              parts = line.split()
              if len(parts) != 2 or not parts[1].startswith("exp:"):
                  malformed.append(f"line {lineno}: {raw!r}")
                  continue
              advisory, exp_field = parts
              if not _ID_RX.fullmatch(advisory):
                  # Anything outside the strict allow-list could carry
                  # shell metachars; refuse rather than try to escape.
                  malformed.append(
                      f"line {lineno}: advisory id {advisory!r} does not "
                      "match GHSA-/PYSEC-/CVE- format"
                  )
                  continue
              try:
                  exp_date = _dt.date.fromisoformat(exp_field[len("exp:") :])
              except ValueError:
                  malformed.append(f"line {lineno}: bad date in {raw!r}")
                  continue
              if exp_date < today:
                  expired.append((advisory, exp_date))
              ignores.append(advisory)

          if malformed:
              sys.stderr.write(
                  "ERROR: malformed entries in pip-audit-ignores.txt:\n  "
                  + "\n  ".join(malformed)
                  + "\n"
              )
              sys.exit(2)

          if expired:
              sys.stderr.write(
                  "ERROR: pip-audit suppressions have expired:\n  "
                  + "\n  ".join(f"{adv} (exp:{d.isoformat()})" for adv, d in expired)
                  + "\nRenew (with a fresh threat assessment) or remove the entries.\n"
              )
              sys.exit(3)

          # Every advisory has now passed the strict regex above, so the
          # flag string contains only ``[A-Za-z0-9-]`` plus spaces and
          # the literal ``--ignore-vuln`` token — safe to interpolate
          # into a shell command without further quoting.
          flags = " ".join(f"--ignore-vuln {adv}" for adv in ignores)
          gh_out = os.environ.get("GITHUB_OUTPUT")
          if gh_out:
              with open(gh_out, "a", encoding="utf-8") as fh:
                  fh.write(f"flags={flags}\n")
          print(f"::notice::pip-audit suppressions OK ({len(ignores)} entries, none expired)")
          PY

      # pip-audit queries the live PyPI/OSV API once per dependency, so a
      # transient upstream 5xx/timeout makes it raise ServiceError and exit
      # non-zero (e.g. "503 Server Error: Backend is unhealthy" from pypi.org).
      # Retry those transient errors so an upstream hiccup doesn't fail the
      # build — but still fail immediately on a real vulnerability finding,
      # which produces a JSON report (not a ServiceError/HTTPError traceback).
      - name: Run pip-audit
        run: |
          cd password_manager
          FLAGS="${{ steps.pip_audit_ignores.outputs.flags }}"
          attempts=4
          for i in $(seq 1 "$attempts"); do
            # Capture pip-audit's exit code directly. ``|| rc=$?`` keeps the
            # failure out of ``set -e``'s path AND records the *raw* code —
            # unlike ``if pip-audit; then ...; fi; rc=$?`` where, on failure, the
            # if-without-else returns 0 and rc would wrongly be 0, letting a real
            # finding ``exit 0`` and bypass the gate.
            rc=0
            pip-audit -r requirements.txt --desc --format json $FLAGS \
              > pip-audit-report.json 2> pip-audit-err.txt || rc=$?
            if [ "$rc" -eq 0 ]; then
              cat pip-audit-report.json
              echo "::notice::pip-audit completed cleanly (attempt $i/$attempts)."
              exit 0
            fi
            if grep -qiE 'ServiceError|HTTPError|ConnectionError|ReadTimeout|Read timed out|Max retries|Temporary failure|NewConnectionError|raise_for_status' pip-audit-err.txt; then
              echo "::warning::pip-audit hit a transient PyPI/network error (attempt $i/$attempts); retrying in 20s"
              tail -n 8 pip-audit-err.txt || true
              sleep 20
              continue
            fi
            # Non-transient failure: a real vulnerability finding (or hard error).
            echo "::error::pip-audit reported vulnerabilities or a non-transient error."
            cat pip-audit-report.json 2>/dev/null || true
            cat pip-audit-err.txt 2>/dev/null || true
            exit "$rc"
          done
          echo "::error::pip-audit still failing after $attempts attempts due to transient PyPI/network errors."
          cat pip-audit-err.txt 2>/dev/null || true
          exit 1
      
      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dependency-scan-results
          path: |
            password_manager/safety-report.json
            password_manager/pip-audit-report.json

  # ===========================================================================
  # Codebase Security Scan (Filesystem)
  # ===========================================================================
  codebase-security-scan:
    name: Codebase Security Scan (FS)
    runs-on: ubuntu-latest
    
    # FIX #3: Minimal permissions
    permissions:
      security-events: write
      contents: read
    
    steps:
      # FIX #2: Pinned to commit hash
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      
      # =====================================================================
      # Scanner 1: Trivy (Filesystem Scan)
      # =====================================================================
      
      - name: Run Trivy Scan
        id: trivy_scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: 1
          ignore-unfixed: false
          vuln-type: 'os,library'
          scanners: 'vuln,secret,config'
          trivy-config: trivy.yaml
        continue-on-error: true

      - name: Ensure Trivy SARIF File is Valid
        id: trivy_sarif_check
        if: always()
        run: |
          # JSON-aware, not a `grep -q '"runs"'` substring match: the grep
          # form also accepts truncated/malformed JSON that merely CONTAINS
          # the literal text "runs" (e.g. a file cut off mid-write), and a
          # non-array or empty `runs` value, neither of which a real
          # completed Trivy scan would ever produce. jq ships on
          # ubuntu-latest by default.
          #
          # `valid` output records whether trivy-fs.sarif was ALREADY good
          # before this step touched it -- i.e. whether Trivy actually
          # completed and wrote real results. This is deliberately NOT the
          # same thing as `trivy_scan`'s own step outcome: `exit-code: 1`
          # above makes that step report failure on real FINDINGS too (the
          # scan working exactly as designed), not only when the scanner
          # itself never ran -- Trivy writes the SARIF report before it
          # applies that exit-code gate, so a "failed" step here can still
          # have produced a perfectly valid file.
          if jq -e 'type == "object" and (.runs | type == "array" and length > 0)' \
            trivy-fs.sarif > /dev/null 2>&1; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"Trivy"}}}]}' > trivy-fs.sarif
          fi

      # FIX #2: Pinned to commit hash
      #
      # Gated on `valid == 'true'`: the fallback SARIF written above when the
      # scan didn't produce real output represents a "completed, no results"
      # run. Uploading it unconditionally would misrepresent an unavailable
      # scanner as a clean pass in the Security tab. Only upload when Trivy
      # actually produced real results (mirrors the Gitleaks upload gate above).
      - name: Upload Trivy Results
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v4.36.2
        if: always() && steps.trivy_sarif_check.outputs.valid == 'true'
        with:
          sarif_file: 'trivy-fs.sarif'
          category: 'trivy-fs'

      # =====================================================================
      # Scanner 2: Grype (Filesystem Scan)
      # =====================================================================

      - name: Install Grype
        id: grype_install
        run: |
          # `set -o pipefail`: without it, a failing `curl` (network error,
          # a transient 503) produces no stdout, `sh` receives an EMPTY
          # script on its stdin and exits 0 (nothing to run is not an
          # error), and the pipeline's own exit code is `sh`'s -- so this
          # step reports SUCCESS even though nothing was installed.
          # Verified empirically (`false | sh` exits 0 without pipefail, 1
          # with it) rather than assumed; confirmed via the actual job log
          # that THIS step's shell is `bash -e {0}`, not GitHub's
          # `-o pipefail`-including default some other actions in this same
          # job get. Pinned to a specific commit of the installer script,
          # matching this file's own stated policy (header comment,
          # "FIX #2: All actions pinned to immutable commit hashes") that
          # every OTHER remote reference in this file already follows.
          #
          # Bounded retry with backoff, matching ci-sbom.yml's Syft install
          # step exactly: this step previously made exactly one attempt, so
          # a single transient GitHub releases-API blip marked Grype
          # "Unavailable" for the whole scan even though the identical
          # failure class is already retried elsewhere in this repo (Syft's
          # own install above it in that file, Gitleaks' docker pull,
          # pip-audit).
          set -o pipefail
          attempts=0
          max_attempts=5
          backoff=10
          while : ; do
            attempts=$((attempts + 1))
            if curl -sSfL https://raw.githubusercontent.com/anchore/grype/b5fa92bbcbef655497e3be840a2f718380e2cdd3/install.sh \
              | sh -s -- -b /usr/local/bin; then
              break
            fi
            if [ "$attempts" -ge "$max_attempts" ]; then
              echo "ERROR: Could not install Grype after $max_attempts attempts" >&2
              exit 1
            fi
            echo "Grype install attempt $attempts/$max_attempts failed; retrying in ${backoff}s..." >&2
            sleep "$backoff"
            backoff=$((backoff * 2))
          done
        continue-on-error: true

      - name: Run Grype Scan
        id: grype_scan
        if: steps.grype_install.outcome == 'success'
        run: |
          grype dir:. -o sarif > grype-fs.sarif
          # Determine if we should fail (manually checking for vulnerabilities if needed, or rely on SARIF upload)
          # Grype doesn't support exit code on fail natively with strict logic without -f, but we want reporting first.
        continue-on-error: true

      - name: Ensure Grype SARIF File Exists
        id: grype_sarif_check
        if: always()
        run: |
          # Same JSON-aware check as Trivy's fallback above, for the same
          # reason -- a `grep -q '"runs"'` substring match would accept a
          # truncated file or an empty `runs: []` array, and upload-sarif
          # REJECTS an empty runs array outright ("1 item required; only 0
          # were supplied"), which was failing this job whenever
          # Install/Run Grype failed (e.g. a transient GitHub releases-API
          # 503) even though both are allowed to fail without stopping the
          # scan. Same `valid` output as Trivy's check, for the same reason:
          # a real, meaningful result vs. a synthesized empty placeholder.
          if jq -e 'type == "object" and (.runs | type == "array" and length > 0)' \
            grype-fs.sarif > /dev/null 2>&1; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"Grype"}}}]}' > grype-fs.sarif
          fi

      # FIX #2: Pinned to commit hash
      #
      # Gated on `valid == 'true'` for the same reason as the Trivy upload
      # above: the fallback SARIF stands in for a "completed, no results" run,
      # and uploading it unconditionally would misrepresent an unavailable
      # scanner as a clean pass.
      - name: Upload Grype Results
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v4.36.2
        if: always() && steps.grype_sarif_check.outputs.valid == 'true'
        with:
          sarif_file: grype-fs.sarif
          category: 'grype-fs'

      # =====================================================================
      # Generate Scan Report
      # =====================================================================

      - name: Generate Scan Summary
        if: always()
        env:
          # A scanner is only genuinely "Complete" if it actually produced a
          # real result; the steps above are ALL continue-on-error (a
          # scanner blip must not fail this job), so without this the
          # summary claimed "Complete" unconditionally even when a scanner
          # never ran at all -- reporting zero findings from a scanner that
          # never scanned is indistinguishable from a real clean result,
          # silently masking whatever it would have found. Only the
          # Security tab's own SARIF (empty when unavailable) is
          # authoritative; this table is just a human-readable label for it.
          #
          # Deliberately keyed on the SARIF-validity check's own `valid`
          # output, not the scan steps' `outcome` -- `trivy_scan.outcome`
          # is 'failure' both when the scanner never ran AND when it ran
          # perfectly and found real vulnerabilities (`exit-code: 1` above
          # is intentional: fail on findings), and those two cases must not
          # collapse into the same "Unavailable" label. `valid` reflects
          # whether the SARIF the earlier step inspected was already good,
          # which is true in the "ran and found things" case and false only
          # when nothing usable was produced at all.
          TRIVY_STATUS: ${{ steps.trivy_sarif_check.outputs.valid == 'true' && 'Complete' || 'Unavailable (see workflow logs)' }}
          GRYPE_STATUS: ${{ steps.grype_sarif_check.outputs.valid == 'true' && 'Complete' || 'Unavailable (see workflow logs)' }}
        run: |
          echo "## Security Scan Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Scanner | Status | Findings |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|--------|----------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trivy (FS) | $TRIVY_STATUS | See Security tab |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Grype (FS) | $GRYPE_STATUS | See Security tab |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Scan Details" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Scope:** Filesystem (PR Content)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Scanners:** Trivy, Grype" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Severity Threshold:** HIGH, CRITICAL" >> "$GITHUB_STEP_SUMMARY"
  
  # ===========================================================================
  # Consolidated Report
  # ===========================================================================
  generate-report:
    name: Generate Consolidated Report
    runs-on: ubuntu-latest
    needs: [gitleaks, dependency-scan, codebase-security-scan]
    if: always()
    
    # FIX #3: Minimal permissions
    permissions:
      contents: read
      pull-requests: write  # For PR comments
    
    steps:
      # FIX #2: Pinned to commit hash
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      
      # FIX #2: Pinned to commit hash
      - name: Download All Scan Results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: scan-results
          pattern: 'dependency-scan-results' # Only downloading available artifacts
      
      # FIX #1: Safe report generation (no user input interpolation via sed)
      - name: Generate Consolidated Report
        env:
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          python3 -c "
          import os
          import datetime
          sha = os.environ['COMMIT_SHA']
          actor = os.environ['ACTOR']
          date = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d %H:%M:%S UTC')
          
          report = f'''# Multi-Scanner Security Report
          
          **Generated:** {date}
          **Commit:** {sha}
          **Triggered by:** {actor}
          
          ## Scanners Used
          1. **Gitleaks** - Secret detection in git history
          2. **Safety** - Python dependency vulnerabilities
          3. **pip-audit** - PyPI package vulnerabilities
          4. **Trivy** - Filesystem vulnerability scanning
          5. **Grype** - Filesystem CVE detection
          
          ## Scope
          - Codebase scan (Filesystem)
          
          View detailed findings in GitHub Security tab.'''
          
          with open('security-report.md', 'w') as f:
              f.write(report)
          "
      
      # FIX #2: Pinned to commit hash
      - name: Upload Consolidated Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: security-report
          path: security-report.md
          retention-days: 90
      
      # FIX #1: Safe PR comment (no script injection)
      - name: Comment on PR
        if: github.event_name == 'pull_request' && needs.gitleaks.result == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('security-report.md', 'utf8');
            
            // Safe PR comment - no user input interpolation
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });
