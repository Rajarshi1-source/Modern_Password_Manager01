name: Security SBOM & Supply Chain Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  id-token: write   # required for cosign keyless signing

jobs:
  sbom:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: 'password_manager/requirements.txt'

      - name: Install SBOM tools
        run: |
          pip install --upgrade pip
          # cyclonedx-bom 1.x imports `cyclonedx.parser.environment`, which
          # imports `pkg_resources.extern.appdirs` -- removed from current
          # setuptools, so `cyclonedx-py` dies with an ImportError before it
          # reads a single requirement. Discovered by this job failing in 14s
          # when the project moved to a 3.12 floor, but the trigger is the
          # SETUPTOOLS version, not the Python one: `security.yml` still runs
          # the 1.x CLI successfully on 3.12 because it pins `setuptools<81`.
          # That workflow is left alone deliberately -- it works, and it fails
          # loudly (its own verify step) rather than silently.
          # 7.x is the current line and has a different CLI (subcommands
          # instead of `-r -i`), so the generate step below changed with it.
          pip install "cyclonedx-bom>=7,<8"

      - name: Install CycloneDX CLI
        run: |
          curl -sL "https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.25.0/cyclonedx-linux-x64" -o cyclonedx-cli
          chmod +x cyclonedx-cli
          sudo mv cyclonedx-cli /usr/local/bin/

      - name: Check requirements file
        run: |
          ls -la password_manager || true
          test -f password_manager/requirements.txt || (echo "requirements.txt not found" && exit 1)

      - name: CycloneDX CLI version / help
        run: |
          cyclonedx-py --version || true
          cyclonedx-py --help || true

      - name: Generate CycloneDX SBOM
        run: |
          # `--sv 1.5` is deliberate, not a default: cyclonedx-bom 7 emits 1.6
          # unless told otherwise, and the cyclonedx-cli v0.25.0 pinned below
          # validates up to 1.5 -- so leaving it off moves the failure from
          # this step to the validate step.
          cyclonedx-py requirements password_manager/requirements.txt --sv 1.5 --of JSON -o sbom.json

      - name: Verify SBOM exists
        run: |
          if [ ! -f sbom.json ]; then
            echo "ERROR: sbom.json not found — SBOM generation failed" >&2
            exit 1
          fi
          echo "SBOM generated successfully ($(wc -c < sbom.json) bytes)"

      - name: Validate SBOM
        run: |
          cyclonedx-cli validate --input-file sbom.json

      - name: Vulnerability Scan (pip-audit)
        run: |
          pip-audit || true

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.json
