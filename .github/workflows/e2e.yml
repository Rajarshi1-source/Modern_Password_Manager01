name: E2E Tests (Playwright)

# =============================================================================
# frontend/playwright.config.js and 19 specs under frontend/e2e/ have existed
# in the repo with zero CI wiring — @playwright/test was a devDependency but
# nothing ever ran `playwright test`. This workflow runs them for the first
# time.
#
# Deliberately non-blocking (`continue-on-error: true` on the test step):
# the specs are a mixed bag — some mock every network call via `page.route`,
# others call `/api/` endpoints directly with no mock, against the Django
# backend booted below — so a clean pass across all 19 on day one is not
# expected. Green vs.
# red on this check is diagnostic for now, not a merge gate.
#
# Chromium only, not the full 5-project matrix (chromium/firefox/webkit/
# Mobile Chrome/Mobile Safari) that playwright.config.js declares: that
# config also sets `workers: 1` and `retries: 2` on CI, so 19 specs across
# all 5 projects serially would make this workflow prohibitively slow.
# `npm run test:e2e:ci` (added alongside this workflow) pins
# `--project=chromium`. Widen once the suite's actual pass rate is known.
#
# 2026-09-16 (run #3): the first real run confirmed the "not expected to be
# clean" prediction above more severely than planned for — nearly all 317
# tests failed (mostly ECONNREFUSED to 127.0.0.1:8000, since no backend is
# booted here) and, combined with playwright.config.js's CI `retries: 2` and
# the default 60s per-test timeout, that is up to ~3 minutes of dead time
# PER failing test. Over ~300 failing tests, the job blew past GitHub's
# hard 6-hour job cap and was killed mid-run without ever producing a
# report. Retries exist for flaky tests, not deterministic
# infra-is-missing failures, so `test:e2e:ci` now passes `--retries=0
# --max-failures=40` (bail out after 40 failures) to bound runtime without
# changing any individual test's pass/fail verdict. `timeout-minutes` below
# is a hard backstop on top of that.
#
# 2026-09-17: per CodeRabbit review, "no backend booted" above was a real
# gap, not just a documented tradeoff — Vite's dev-server proxy (see
# frontend/vite.config.js) forwards /api, /auth, /dj-rest-auth and /ws to
# 127.0.0.1:8000, so any spec that doesn't mock its network calls (e.g.
# geofencing.spec.ts) was guaranteed to hit ECONNREFUSED rather than
# exercising real backend logic. The boot sequence below (Postgres +
# Redis services, migrate, `runserver` in the background, bounded
# readiness poll on /api/health/) is copied from the proven pattern in
# load-test.yml / stackhawk.yml. This makes backend-dependent specs reach
# a live API instead of failing on connection errors; it does NOT seed
# per-spec fixture data (test users, vault items, geofence zones, etc.),
# so specs that assume pre-existing accounts/data can still fail on
# assertions rather than connections — that is a much larger, separate
# effort (per-spec fixture/seed work) intentionally left out of this
# surgical fix.
# =============================================================================

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/e2e.yml'
  schedule:
    - cron: '11 4 * * *'  # nightly at 04:11 UTC
  workflow_dispatch: {}

env:
  NODE_VERSION: '22'

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Job-level (not step-level) so these are also visible to the
    # "Run Playwright E2E tests" step: layered_recovery.spec.js shells
    # out to `python manage.py advance_time_lock` directly from the test
    # process and needs to reach the same database as the `runserver`
    # started below.
    env:
      DEBUG: 'True'
      SECRET_KEY: 'e2e-test-secret-key-not-for-production'
      DB_NAME: test_db
      DB_USER: test_user
      DB_PASSWORD: test_password
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DATABASE_URL: postgresql://test_user:test_password@127.0.0.1:5432/test_db
      REDIS_URL: redis://127.0.0.1:6379/0
      ALLOWED_HOSTS: '*'

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Free disk space on runner
        # Same disk-exhaustion risk as ci.yml/stackhawk.yml/load-test.yml
        # during pip install of the ML dependency stack.
        run: |
          set -eu
          df -h /
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          docker image prune -a -f || true
          df -h /

      - name: Install backend dependencies
        run: |
          cd password_manager
          python -m pip install --no-cache-dir --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Start Django backend
        run: |
          cd password_manager
          python manage.py migrate --noinput
          python manage.py runserver 0.0.0.0:8000 &
          # Bounded polling instead of a fixed sleep: fails the step
          # outright if Django never becomes ready within 60s, rather than
          # letting Playwright start hammering a server that isn't
          # listening yet.
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --connect-timeout 2 --max-time 5 http://127.0.0.1:8000/api/health/; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Django server did not become ready" >&2
              exit 1
            fi
            sleep 2
          done

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browsers (chromium only)
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        working-directory: ./frontend
        # playwright.config.js's `webServer` block boots `npm run dev` on
        # :5173 itself (reuseExistingServer is false on CI), so no manual
        # frontend server-start step is needed here. The Django backend
        # was already started above on :8000, which Vite's dev-server
        # proxy (vite.config.js) forwards /api, /auth, /dj-rest-auth and
        # /ws to.
        run: npm run test:e2e:ci
        continue-on-error: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            frontend/e2e-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14
